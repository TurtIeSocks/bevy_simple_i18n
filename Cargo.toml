[package]
name = "bevy_simple_i18n"
version = "0.4.0"
edition = "2021"
rust-version = "1.95.0"
authors = ["TurtIeSocks"]
license = "MIT OR Apache-2.0"
description = "Bevy i18n plugin"
repository = "https://github.com/TurtIeSocks/bevy_simple_i18n"
homepage = "https://github.com/TurtIeSocks/bevy_simple_i18n"
keywords = ["bevy", "gamedev", "i18n", "localization"]
categories = ["game-development", "localization"]
readme = "./README.md"
exclude = ["assets/"]

[package.metadata.docs.rs]
all-features = true

[workspace]
members = ["web"]

[features]
default = ["numbers", "yaml", "toml", "detect", "plurals"]
numbers = ["fixed_decimal", "icu_decimal", "fixed_decimal/ryu"]
yaml = ["dep:serde_yaml"]
toml = ["dep:serde_toml"]
# Detect the system/device locale at startup (iOS/Android/wasm/desktop)
detect = ["dep:bevy_device_lang"]
# CLDR plural categories for .with_count() (needs numbers for %{count} formatting)
plurals = ["numbers", "dep:icu_plurals"]
# I18nTarget impl for bevy_rich_text3d's FetchedTextSegment + the
# I18nText3dSegment component. Off by default: it pins a third-party
# release cadence.
rich_text3d = ["dep:bevy_rich_text3d"]
# I18nTarget impl for bevy_fontmesh's TextMesh + the I18nTextMesh component.
# Off by default: it pins a third-party release cadence.
fontmesh = ["dep:bevy_fontmesh"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
  "bevy_ui",
  "bevy_asset",
  "bevy_text",
  "bevy_sprite", # provides Text2d (moved out of bevy_text in 0.17)
  "bevy_log",
] }
# icu_locale_core replaces the formally deprecated icu_locid (ICU4X 2.x)
icu_locale_core = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.12 matches the ron version bevy_asset 0.19 itself uses (no duplicate ron in trees)
ron = "0.12"
# serde_yaml 0.9 is what rust-i18n parses with today -> identical YAML behavior
serde_yaml = { version = "0.9", optional = true }
serde_toml = { version = "1", package = "toml", optional = true }
thiserror = "2"

# bevy-independent (jni/objc2/web-sys per platform), so it can't lag bevy releases
bevy_device_lang = { version = "0.6", optional = true }
bevy_rich_text3d = { version = "0.7", optional = true }
bevy_fontmesh = { version = "0.6", optional = true }

fixed_decimal = { version = "0.7", optional = true }
# `alloc` gates DecimalFormatter::format_to_string in icu_decimal 2.x
icu_decimal = { version = "2", optional = true, features = ["alloc"] }
icu_plurals = { version = "2", optional = true }

[dev-dependencies]
bevy = { version = "0.19" }

[[example]]
name = "basic"
path = "examples/basic.rs"
required-features = ["numbers"]

[[example]]
name = "changing_locale"
path = "examples/changing_locale.rs"
required-features = ["numbers"]

[[example]]
name = "rich_text_3d"
path = "examples/rich_text_3d.rs"
required-features = ["rich_text3d"]

[[example]]
name = "font_mesh"
path = "examples/font_mesh.rs"
required-features = ["fontmesh"]
